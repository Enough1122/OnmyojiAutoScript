<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕扛车 · 全速狂奔</title>
<style>
  body { margin: 0; background: #0e1626; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .stage { width: min(960px, 96vw); border-radius: 12px; overflow: hidden; box-shadow: 0 12px 48px rgba(0,0,0,.55); }
  svg { display: block; width: 100%; height: auto; }

  /* —— 跑步起伏 —— */
  .bob { animation: bob .45s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

  /* —— 双腿交替摆动 —— */
  .legA, .legB { transform-box: fill-box; transform-origin: 50% 0%; animation: swing .45s ease-in-out infinite; }
  .legB { animation-delay: -.225s; }
  @keyframes swing { 0%,100% { transform: rotate(28deg); } 50% { transform: rotate(-28deg); } }

  /* —— 近侧翅膀扇动 —— */
  .wing { transform-box: fill-box; transform-origin: 85% 60%; animation: flap .45s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(-22deg); } 50% { transform: rotate(26deg); } }

  /* —— 扶车翅膀轻微晃动 —— */
  .hold { transform-box: fill-box; transform-origin: 50% 100%; animation: sway .45s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  /* —— 喉囊颠簸 —— */
  .pouch { transform-box: fill-box; transform-origin: 50% 0%; animation: pouch .45s ease-in-out infinite; }
  @keyframes pouch { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.14); } }

  /* —— 地面影子 —— */
  .shadow { transform-box: fill-box; transform-origin: 50% 50%; animation: shadow .45s ease-in-out infinite; }
  @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .16; } 50% { transform: scaleX(.9); opacity: .1; } }

  /* —— 地面滚动 —— */
  .dash { animation: scroll .45s linear infinite; }
  @keyframes scroll { to { transform: translateX(-80px); } }

  /* —— 速度线 —— */
  .speed { animation: zip .35s linear infinite; }
  @keyframes zip { to { transform: translateX(-160px); } }

  /* —— 云漂移 —— */
  .cloud1 { animation: drift 26s linear infinite; }
  .cloud2 { animation: drift 38s linear infinite; }
  .cloud3 { animation: drift 31s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1150px); } }

  /* —— 太阳呼吸 —— */
  .sun { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  /* —— 扬尘 —— */
  .puff { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; animation: puff .6s ease-out infinite; }
  .puff.p2 { animation-delay: -.2s; }
  .puff.p3 { animation-delay: -.4s; }
  @keyframes puff {
    0% { opacity: .85; transform: translate(0,0) scale(.5); }
    100% { opacity: 0; transform: translate(-46px,-28px) scale(1.4); }
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec1f5"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="352" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g class="sun">
    <circle cx="110" cy="88" r="52" fill="#ffd93b" opacity=".25"/>
    <circle cx="110" cy="88" r="38" fill="#ffd93b"/>
  </g>

  <!-- 云 -->
  <g class="cloud1" opacity=".95">
    <g transform="translate(820,70)">
      <ellipse cx="0" cy="0" rx="46" ry="20" fill="#fff"/>
      <ellipse cx="34" cy="6" rx="36" ry="16" fill="#fff"/>
      <ellipse cx="-34" cy="7" rx="30" ry="14" fill="#fff"/>
    </g>
  </g>
  <g class="cloud2" opacity=".9">
    <g transform="translate(900,140)">
      <ellipse cx="0" cy="0" rx="56" ry="22" fill="#fff"/>
      <ellipse cx="42" cy="7" rx="40" ry="17" fill="#fff"/>
      <ellipse cx="-42" cy="8" rx="34" ry="15" fill="#fff"/>
    </g>
  </g>
  <g class="cloud3" opacity=".85">
    <g transform="translate(760,45)">
      <ellipse cx="0" cy="0" rx="34" ry="15" fill="#fff"/>
      <ellipse cx="26" cy="5" rx="26" ry="12" fill="#fff"/>
    </g>
  </g>

  <!-- 远处飞鸟 -->
  <path d="M620,92 q8,-8 16,0 q8,-8 16,0" stroke="#0c4a6e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M664,118 q6,-6 12,0 q6,-6 12,0" stroke="#0c4a6e" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 地面 -->
  <rect x="0" y="350" width="800" height="100" fill="#7bc96f"/>
  <rect x="0" y="350" width="800" height="10" fill="#93d888"/>
  <g class="dash" fill="#57a55a" opacity=".8">
    <rect x="0" y="392" width="44" height="8" rx="4"/>
    <rect x="80" y="392" width="44" height="8" rx="4"/>
    <rect x="160" y="392" width="44" height="8" rx="4"/>
    <rect x="240" y="392" width="44" height="8" rx="4"/>
    <rect x="320" y="392" width="44" height="8" rx="4"/>
    <rect x="400" y="392" width="44" height="8" rx="4"/>
    <rect x="480" y="392" width="44" height="8" rx="4"/>
    <rect x="560" y="392" width="44" height="8" rx="4"/>
    <rect x="640" y="392" width="44" height="8" rx="4"/>
    <rect x="720" y="392" width="44" height="8" rx="4"/>
    <rect x="800" y="392" width="44" height="8" rx="4"/>
    <rect x="880" y="392" width="44" height="8" rx="4"/>
  </g>

  <!-- 速度线 -->
  <g class="speed" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".7">
    <line x1="60" y1="150" x2="180" y2="150"/>
    <line x1="20" y1="215" x2="150" y2="215"/>
    <line x1="70" y1="280" x2="220" y2="280"/>
    <line x1="220" y1="150" x2="340" y2="150"/>
    <line x1="180" y1="215" x2="310" y2="215"/>
    <line x1="230" y1="280" x2="380" y2="280"/>
  </g>

  <!-- 影子 -->
  <ellipse class="shadow" cx="365" cy="374" rx="112" ry="12" fill="#000000"/>

  <!-- 扬尘 -->
  <circle class="puff" cx="285" cy="362" r="9" fill="#ffffff"/>
  <circle class="puff p2" cx="272" cy="366" r="7" fill="#ffffff"/>
  <circle class="puff p3" cx="292" cy="368" r="6" fill="#eef3f0"/>

  <!-- ===== 鹈鹕 + 自行车 ===== -->
  <g class="bob">
    <g transform="rotate(-3 360 260)">

      <!-- 后腿（深色） -->
      <g class="legB">
        <rect x="341" y="305" width="9" height="50" rx="4" fill="#d97706"/>
        <polygon points="341,355 372,355 364,364 341,364" fill="#d97706"/>
      </g>

      <!-- 尾巴 -->
      <polygon points="288,250 244,234 250,266 288,272" fill="#e5edf4"/>

      <!-- 身体 -->
      <ellipse cx="355" cy="265" rx="72" ry="46" fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/>
      <ellipse cx="355" cy="283" rx="55" ry="25" fill="#e8eef4"/>

      <!-- 脖子 -->
      <path d="M405,250 C415,235 418,225 424,208" stroke="#ffffff" stroke-width="26" stroke-linecap="round" fill="none"/>

      <!-- 头 -->
      <circle cx="428" cy="196" r="26" fill="#ffffff"/>
      <polygon points="408,178 392,166 406,188" fill="#e8eef4"/>
      <!-- 眼睛 -->
      <circle cx="436" cy="190" r="4.2" fill="#111827"/>
      <circle cx="437.5" cy="188.5" r="1.3" fill="#fff"/>

      <!-- 喙（上） -->
      <polygon points="448,186 548,206 448,200" fill="#f59e0b"/>
      <!-- 喉囊（下，会颠） -->
      <g class="pouch">
        <path d="M448,200 L545,214 L472,234 Q454,228 448,200 Z" fill="#f6a97c"/>
      </g>

      <!-- 扶车翅膀（远侧，撑住车架） -->
      <g class="hold">
        <path d="M356,252 C361,224 368,190 376,160 L389,164 C381,192 376,226 374,254 Z" fill="#e9eff5" stroke="#d7e0e8" stroke-width="1.5"/>
        <circle cx="382" cy="162" r="8" fill="#ffffff" stroke="#d7e0e8" stroke-width="1.5"/>
      </g>

      <!-- ===== 自行车（扛在肩上） ===== -->
      <g transform="rotate(-6 370 140)">
        <!-- 后轮 -->
        <g>
          <circle cx="295" cy="140" r="34" fill="none" stroke="#1f2937" stroke-width="8"/>
          <circle cx="295" cy="140" r="25" fill="none" stroke="#9ca3af" stroke-width="2"/>
          <g stroke="#9ca3af" stroke-width="2">
            <line x1="295" y1="115" x2="295" y2="165"/>
                            <line x1="270" y1="140" x2="320" y2="140"/>
            <line x1="277" y1="122" x2="313" y2="158"/>
            <line x1="313" y1="122" x2="277" y2="158"/>
            <animateTransform attributeName="transform" type="rotate" from="0 295 140" to="360 295 140" dur="0.7s" repeatCount="indefinite"/>
          </g>
          <circle cx="295" cy="140" r="4" fill="#374151"/>
        </g>
        <!-- 前轮 -->
        <g>
          <circle cx="445" cy="140" r="34" fill="none" stroke="#1f2937" stroke-width="8"/>
          <circle cx="445" cy="140" r="25" fill="none" stroke="#9ca3af" stroke-width="2"/>
          <g stroke="#9ca3af" stroke-width="2">
            <line x1="445" y1="115" x2="445" y2="165"/>
            <line x1="420" y1="140" x2="470" y2="140"/>
            <line x1="427" y1="122" x2="463" y2="158"/>
            <line x1="463" y1="122" x2="427" y2="158"/>
            <animateTransform attributeName="transform" type="rotate" from="0 445 140" to="360 445 140" dur="0.7s" repeatCount="indefinite"/>
          </g>
          <circle cx="445" cy="140" r="4" fill="#374151"/>
        </g>
        <!-- 车架 -->
        <g stroke="#e11d48" stroke-width="6" stroke-linecap="round" fill="none">
          <line x1="295" y1="140" x2="368" y2="158"/>
          <line x1="368" y1="158" x2="345" y2="102"/>
          <line x1="345" y1="102" x2="435" y2="106"/>
          <line x1="435" y1="106" x2="445" y2="140"/>
          <line x1="435" y1="106" x2="443" y2="88"/>
        </g>
        <!-- 车座 & 车把 -->
        <line x1="334" y1="98" x2="357" y2="98" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/>
        <line x1="436" y1="86" x2="452" y2="86" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
        <circle cx="368" cy="158" r="6" fill="#374151"/>
      </g>

      <!-- 扇动翅膀（近侧） -->
      <path class="wing" d="M352,242 C318,236 292,250 280,282 C302,276 332,272 354,266 Z"
            fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/>

      <!-- 前腿（亮色） -->
      <g class="legA">
        <rect x="376" y="308" width="9" height="50" rx="4" fill="#f59e0b"/>
        <polygon points="376,358 407,358 399,367 376,367" fill="#f59e0b"/>
      </g>

    </g>
  </g>

  <!-- 标题 -->
  <text x="20" y="42" font-family="sans-serif" font-size="26" font-weight="bold" fill="#0c4a6e"
        stroke="#ffffff" stroke-width="4" paint-order="stroke">鹈鹕扛车 · 全速狂奔</text>
</svg>
</div>
</body>
</html>
